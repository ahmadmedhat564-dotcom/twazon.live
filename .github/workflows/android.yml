name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js www/
          cp -r icons www/icons
      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 sharp
      - name: Create Android project
        run: |
          npx cap init "توازن" com.tawazon.app --web-dir=www
          npx cap add android
      - name: Set app icon
        run: |
          cat > icon.js <<'EOF2'
          const sharp = require('sharp'), fs = require('fs');
          const res = 'android/app/src/main/res';
          fs.rmSync(res + '/mipmap-anydpi-v26', { recursive: true, force: true });
          const sizes = { mdpi: 48, hdpi: 72, xhdpi: 96, xxhdpi: 144, xxxhdpi: 192 };
          (async () => {
            for (const [d, s] of Object.entries(sizes))
              for (const n of ['ic_launcher', 'ic_launcher_round', 'ic_launcher_foreground'])
                await sharp('icons/icon-512.png').resize(s, s).toFile(res + '/mipmap-' + d + '/' + n + '.png');
          })();
          EOF2
          node icon.js
          npx cap sync android
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: tawazon-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
