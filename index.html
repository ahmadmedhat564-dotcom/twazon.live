<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>توازن</title><meta name="theme-color" content="#022f28"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ff:Cairo,Tahoma,sans-serif;--bg:#f2f5ef;--card:#fff;--ink:#1d2a22;--mut:#667268;--ac:#3b7a4b;--ac2:#e8833a;--ln:#dde4d9;--soft:#e6efe2;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a16;--card:#1d261f;--ink:#ecf2ea;--mut:#9aa89c;--ac:#6cc27f;--ac2:#f2994f;--ln:#2d3a30;--soft:#243228;color-scheme:dark}}
*{box-sizing:border-box}html,body{overflow-x:hidden;width:100%}.row>*{min-width:0}input,select{min-width:0;max-width:100%}input[type=time]{-webkit-appearance:none;appearance:none}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--ff);max-width:480px;margin:auto;padding-bottom:84px}
h1{font-size:26px;font-weight:800;margin:0;display:inline-block;border-bottom:4px solid var(--ac2)}h2{font-size:19px;font-weight:800;margin:20px 0 8px}
.w{padding:16px}.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin:10px 0}
label{display:block;font-weight:600;margin:12px 0 4px}
input,select{width:100%;padding:11px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.row{display:flex;gap:10px}.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border:1px solid var(--ln);border-radius:99px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:var(--ac);color:#fff;font:800 17px var(--ff);margin-top:18px;cursor:pointer}
.btn.g{background:var(--soft);color:var(--ink)}
.bar{height:10px;background:var(--soft);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);width:0;transition:width .3s}
.big{font-size:40px;font-weight:800;line-height:1.1;color:var(--ac2)}.mut{color:var(--mut);font-size:14px}
.tl{border-inline-start:3px solid var(--ac);padding:2px 14px;margin:0 0 14px;margin-inline-start:6px}
.tl b{color:var(--ac)}
.tl.w2{border-color:var(--ac2)}.tl.w2 b{color:var(--ac2)}
.food{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}
.food:last-child{border:0}.food div:first-child{flex:1}
.qb{width:34px;height:34px;border-radius:50%;border:1px solid var(--ln);background:var(--card);color:var(--ink);font:800 18px var(--ff);cursor:pointer}
.q{min-width:22px;text-align:center;font-weight:800}
nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:auto;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:12px 4px;border:0;background:none;color:var(--mut);font:600 13px var(--ff);cursor:pointer}
nav button.on{color:var(--ac);font-weight:800;box-shadow:inset 0 3px 0 var(--ac2)}
.tip{background:var(--soft);border-radius:10px;padding:10px;margin-top:8px;font-size:14px}
.steps{display:flex;gap:6px;margin:12px 0}.steps i{flex:1;height:5px;border-radius:5px;background:var(--ln)}.steps i.on{background:var(--ac)}
.hide{display:none!important}#bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;height:52px;padding:0 14px;background:#022f28}#bar img{height:30px}#bar button{background:#0b4a3f;color:#9ef08f;border:0;border-radius:8px;padding:6px 10px;font:600 13px var(--ff);cursor:pointer}
html[lang=en]{--ff:Montserrat,Cairo,sans-serif}
.lg{margin:-16px -16px -84px;min-height:100vh;padding:20px 22px 40px;background:radial-gradient(120% 70% at 50% 0,#0d5a45 0,#022f28 60%);color:#e7f6e4;display:flex;flex-direction:column;align-items:center}
.lgt{align-self:stretch;display:flex;justify-content:flex-end}.lgl{background:rgba(158,240,143,.12);color:#9ef08f;border:1px solid rgba(158,240,143,.3);border-radius:99px;padding:6px 14px;font:600 13px var(--ff);cursor:pointer}
.lgi{width:230px;max-width:70%;margin:38px 0 4px}.lgs{opacity:.8;margin-bottom:26px;text-align:center}
.lgc{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(158,240,143,.18);border-radius:20px;padding:18px}
.lgtabs{display:flex;background:rgba(0,0,0,.25);border-radius:12px;padding:4px;margin-bottom:6px}.lgtabs button{flex:1;border:0;background:none;color:#cfe8cb;padding:9px;border-radius:9px;font:600 15px var(--ff);cursor:pointer}.lgtabs .on{background:#9ef08f;color:#022f28}
.lg input{margin-top:10px;background:rgba(0,0,0,.28);border:1px solid rgba(158,240,143,.22);color:#fff}.lg input::placeholder{color:#8fb59a}.lerr{color:#ffb3a3;min-height:22px;font-size:14px;margin-top:6px}
.lgb{width:100%;padding:14px;border:0;border-radius:12px;background:#9ef08f;color:#022f28;font:800 17px var(--ff);cursor:pointer}.lgg{width:100%;margin-top:10px;padding:12px;border:1px solid rgba(158,240,143,.35);border-radius:12px;background:none;color:#9ef08f;font:600 15px var(--ff);cursor:pointer}.lgf{margin-top:18px;font-size:13px;opacity:.6}.chip.o{border-color:var(--ac2);color:var(--ac2);font-weight:800}.ex{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}.ex b{color:var(--ac2);white-space:nowrap}.sc{position:sticky;top:52px;background:var(--bg);padding:8px 0;z-index:2}.sc .chips{flex-wrap:nowrap;overflow-x:auto}.sc .chip{white-space:nowrap}.an{width:128px;height:96px;flex:none;background:var(--soft);border-radius:10px}.an path{fill:none;stroke:var(--ink);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.an .f{stroke:var(--mut)}.an .g{stroke:var(--ln);stroke-width:2}.an .d{stroke:var(--ac2);stroke-width:7}.an circle{fill:var(--ac)}.ex>div{flex:1}.ex{align-items:center}.hw{font-size:14px;margin-top:4px}
</style>
</head>
<body>
<div id="bar" class="hide"></div><div id="app" class="w"></div>
<nav id="nav" class="hide"></nav>
<script>
var S={step:0,p:{age:28,h:170,w:75,sex:'m',goal:'lose',cond:[],wake:'07:00',sleep:'23:30',ws:'09:00',we:'17:00',commute:45,gym:'no',mins:'30',eq:'none',meals:3,eat:'home',budget:'eco',walk:'mid'},log:{},water:0,tab:'home'};
try{S.lang=localStorage.getItem('tz_lang')||'ar';var u0=localStorage.getItem('tz_sess');if(u0)loadU(u0)}catch(e){}
function pushW(){try{var P=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Preferences;if(!P||!S.auth||!S.done)return;var t=calc(),e=eaten(),wt=Math.round(S.p.w*33/250)||8,en=S.lang=='en';P.set({key:'tz_widget',value:JSON.stringify({l:Math.max(0,t-e),t:t,e:e,w:S.water,wt:wt,a:en?'kcal left':'\u0633\u0639\u0631 \u0645\u062a\u0628\u0642\u064a',b:en?'cups of water':'\u0643\u0648\u0628\u0627\u064a\u0627\u062a \u0645\u064a\u0627\u0647'})})}catch(x){}}
function save(){try{localStorage.setItem('sehhetak:'+(S.user||'guest'),JSON.stringify(S))}catch(e){}pushW()}
var FOODS=[
['رغيف عيش بلدي',230,'رغيف'],['فول مدمس',200,'طبق'],['طعمية',70,'قرص'],['لوبيا',220,'طبق'],['عدس',230,'طبق'],['سبانخ',120,'طبق'],['ملوخية',110,'طبق'],['بامية',130,'طبق'],['أرز',205,'كوباية'],['مكرونة',300,'طبق'],['كشري',500,'طبق'],['فراخ مشوية',250,'ربع'],['سمك مشوي',220,'قطعة'],['بيض مسلوق',75,'بيضة'],['جبنة قريش',100,'علبة'],['زبادي',80,'علبة'],['بطاطس مسلوقة',130,'حبة'],['سلطة خضار',40,'طبق'],['شاي بسكر',40,'كوباية'],['تفاحة / موزة',90,'حبة']];
var SWAP={1:'الفول: خليه بليمون وطماطم بدل الزيت الكتير',2:'الطعمية: اتنين أو تلاتة بس، مع سلطة وعيش أقل',9:'المكرونة: نص طبق + سلطة بدل طبق كامل',10:'الكشري: من غير تقلية كتير وبصلة مقلية قليلة',18:'الشاي: قلل السكر لمعلقة واحدة'};
function $(h){document.getElementById('app').innerHTML=h}
function tm(s){var a=s.split(':');return +a[0]*60+ +a[1]}
function ft(m){m=((m%1440)+1440)%1440;var h=Math.floor(m/60),n=m%60,ap=S.lang=='en'?(h>=12?'PM':'AM'):(h>=12?'م':'ص');h=h%12||12;return h+':'+(n<10?'0':'')+n+' '+ap}
function chips(k,opts,multi){return '<div class="chips">'+opts.map(function(o){var on=multi?S.p[k].indexOf(o[0])>-1:S.p[k]===o[0];return '<button class="chip'+(on?' on':'')+'" onclick="pick(\''+k+'\',\''+o[0]+'\','+!!multi+')">'+o[1]+'</button>'}).join('')+'</div>'}
function pick(k,v,m){if(m){var i=S.p[k].indexOf(v);i>-1?S.p[k].splice(i,1):S.p[k].push(v)}else S.p[k]=v;read();render()}
function inp(k,l,t){return '<div><label>'+l+'</label><input type="'+(t||'number')+'" data-k="'+k+'" value="'+S.p[k]+'"></div>'}
function read(){document.querySelectorAll('[data-k]').forEach(function(e){S.p[e.dataset.k]=e.type==='number'?+e.value:e.value})}
var STEPS=['عنك','مواعيدك','الرياضة','الأكل'];
function form(){
var st=S.step,h='<h1>توازن</h1><div class="mut">أسئلة بسيطة وبعدها خطة على قدك</div><div class="steps">'+STEPS.map(function(_,i){return '<i class="'+(i<=st?'on':'')+'"></i>'}).join('')+'</div><h2>'+STEPS[st]+'</h2>';
if(st==0)h+='<div class="row">'+inp('age','السن')+inp('h','الطول (سم)')+inp('w','الوزن (كجم)')+'</div><label>النوع</label>'+chips('sex',[['m','ذكر'],['f','أنثى']])+'<label>هدفك</label>'+chips('goal',[['lose','أخس'],['gain','أزود'],['keep','أحافظ'],['fit','أحسّن صحتي']])+'<label>عندك حاجة من دول؟</label>'+chips('cond',[['sugar','سكر'],['bp','ضغط'],['allergy','حساسية أكل'],['back','ألم ضهر/ركبة']],1);
if(st==1)h+='<div class="row">'+inp('wake','بتصحى','time')+inp('sleep','بتنام','time')+'</div><div class="row">'+inp('ws','الشغل من','time')+inp('we','لحد','time')+'</div>'+inp('commute','المواصلات رايح وجاي (دقيقة)')+'<div class="tip">لو إجازتك في أيام تانية، التطبيق هيسألك بعدين</div>';
if(st==2)h+='<label>الجيم متاح؟</label>'+chips('gym',[['yes','أيوه'],['no','لأ']])+'<label>تقدر تتمرن في البيت كام دقيقة في اليوم؟</label>'+chips('mins',[[10,'10'],[20,'20'],[30,'30'],[60,'60']].map(function(x){return [String(x[0]),x[1]]}))+'<label>عندك أدوات؟</label>'+chips('eq',[['none','من غير'],['band','حبل / حصيرة'],['db','دمبل']])+'<label>المشي في يومك</label>'+chips('walk',[['low','قليل'],['mid','متوسط'],['high','كتير']]);
if(st==3)h+='<label>عدد الوجبات في اليوم</label>'+chips('meals',[['2','2'],['3','3'],['4','4'],['5','5']])+'<label>بتاكل فين أكتر؟</label>'+chips('eat',[['home','البيت'],['out','برة']])+'<label>الميزانية</label>'+chips('budget',[['eco','اقتصادي'],['mid','متوسط'],['open','مفتوح']]);
h+='<div class="row">'+(st>0?'<button class="btn g" onclick="go(-1)">رجوع</button>':'')+'<button class="btn" onclick="go(1)">'+(st==3?'اعمل الخطة':'التالي')+'</button></div>';
$(h)}
function go(d){read();S.step+=d;if(S.step>3){S.step=0;S.done=1;S.tab='home'}save();render()}
function calc(){var p=S.p,bmr=10*p.w+6.25*p.h-5*p.age+(p.sex=='m'?5:-161),f={low:1.3,mid:1.45,high:1.6}[p.walk]||1.4;var t=bmr*f;t+={lose:-400,gain:400,keep:0,fit:0}[p.goal];return Math.round(t/50)*50}
function eaten(){var t=0;(S.log[today()]||{}).hasOwnProperty;var l=S.log[today()]||{};for(var i in l)t+=(FM[i]?FM[i][1]:0)*l[i];return t}
function today(){return new Date().toISOString().slice(0,10)}
function workout(){var p=S.p,m=+p.mins,g=p.gym=='yes',back=p.cond.indexOf('back')>-1;
if(g&&m>=45)return 'جيم: جري خفيف 10 دقايق، أجهزة جسم كامل، وبعدها مشي';
if(g)return 'جيم: مشي سريع على الجهاز ثم أجهزة الأرجل والضهر';
if(p.eq=='db')return back?'دمبل خفيف: تجديف وضغط كتف (من غير ضغط على الضهر) + مشي':'دمبل: سكوات، ضغط كتف، تجديف، بلانك';
if(p.eq=='band')return 'حصيرة وحبل: نط حبل دقيقتين × 5 جولات، بلانك، جسر';
return back?'من غير أدوات: مشي، جسر، تمدد خفيف':'من غير أدوات: سكوات، ضغط، بلانك، قفز في المكان'}
function plan(){var p=S.p,w=tm(p.wake),sl=tm(p.sleep),ws=tm(p.ws),we=tm(p.we),c=+p.commute,n=+p.meals,dur=+p.mins,it=[];
if(sl<w)sl+=1440;
it.push([w,'صحيان','كوباية مياه قبل أي حاجة']);
var first=w+40,last=sl-210,meals=[];for(var i=0;i<n;i++)meals.push(Math.round(first+(last-first)*(n>1?i/(n-1):0)));
var names=['فطار','غدا','عشا','سناك','سناك'];if(n==2)names=['فطار','غدا'];if(n==3)names=['فطار','غدا','عشا'];
var sug={'فطار':'فول بليمون + بيضة + عيش بلدي نص رغيف','غدا':'فراخ مشوية + أرز كوباية + سلطة وخضار','عشا':'زبادي + جبنة قريش + خيار وطماطم','سناك':'فاكهة أو زبادي'};
if(p.cond.indexOf('sugar')>-1)sug['فطار']='فول + بيضة + عيش بلدي رُبع رغيف (من غير سكر)';
var ni=0,sn=0;meals.forEach(function(t,i){var nm=names[i]||'سناك';if(nm=='سناك'&&(i>2))nm='سناك';it.push([t,nm,sug[nm]||sug['سناك']])});
it.push([ws-c/2,'خروج للشغل','المواصلات حوالي '+Math.round(c/2)+' دقيقة. ممكن تنزل قبل محطة وتمشي']);
it.push([ws,'بداية الشغل','خد بريك مشي 5 دقايق كل ساعتين']);
it.push([we,'نهاية الشغل','']);
var wt=we+c/2+45;if(wt+dur>sl-150)wt=w+20;
it.push([wt,'تمرين '+dur+' دقيقة',workout()]);
it.push([sl-180,'آخر أكل','بعدها مياه بس']);
it.push([sl,'نوم','7 ساعات على الأقل']);
return it.sort(function(a,b){return a[0]-b[0]})}
function home(){var t=calc(),e=eaten(),pc=Math.min(100,Math.round(e/t*100)),wt=Math.round(S.p.w*33/250)||8;
$('<h1>النهارده</h1><div class="card"><div class="mut">السعرات المتاحة لك</div><div class="big">'+e+' <span class="mut">/ '+t+'</span></div><div class="bar" style="margin:10px 0"><i style="width:'+pc+'%"></i></div><div class="mut">باقي '+Math.max(0,t-e)+' سعر</div></div><div class="card"><b>المياه</b><div class="mut">'+S.water+' من '+wt+' كوبايات</div><div class="bar" style="margin:8px 0"><i style="width:'+Math.min(100,S.water/wt*100)+'%;background:var(--ac2)"></i></div><div class="row"><button class="btn g" style="margin:0" onclick="S.water=Math.max(0,S.water-1);save();render()">−</button><button class="btn" style="margin:0" onclick="S.water++;save();render()">+ كوباية</button></div></div><div class="card"><b>تمرين النهارده</b><div>'+workout()+'</div></div><button class="btn g" onclick="S.done=0;S.step=0;save();render()">عدّل إجاباتك</button>')}
function planV(){var h='<h1>خطة يومك</h1><div class="mut">متظبطة على مواعيدك</div><div style="margin-top:14px">';
plan().forEach(function(x){var w=/تمرين/.test(x[1]);h+='<div class="tl'+(w?' w2':'')+'"><b>'+ft(x[0])+'</b> '+x[1]+(x[2]?'<div class="mut">'+x[2]+'</div>':'')+'</div>'});$(h+'</div>')}
function foodV(){var l=S.log[today()]||{},h='<h1>سجّل أكلك</h1><div class="mut">السعرات تقريبية</div><div class="card">';
FOODS.forEach(function(f,i){h+='<div class="food"><div>'+f[0]+'<div class="mut">'+f[1]+' سعر / '+f[2]+(SWAP[i]&&l[i]?'':'')+'</div></div><button class="qb" onclick="qty('+i+',-1)">−</button><span class="q">'+(l[i]||0)+'</span><button class="qb" onclick="qty('+i+',1)">+</button></div>'});
h+='</div>';var sw='';for(var i in l)if(l[i]&&SWAP[i])sw+='<div>'+SWAP[i]+'</div>';
if(sw)h+='<div class="tip"><b>بدائل أخف</b>'+sw+'</div>';

var INFO={};'إحماء وتحريك المفاصل|walk|لف كتافك ورقبتك ومعصمك، واتحرك في مكانك وارفع ركبك براحة.;سكوات|squat|رجليك بعرض كتافك. انزل كأنك هتقعد على كرسي والضهر مفرود، وارجع واقف. الركب ما تعدّيش صوابع رجليك.;ضغط (بوش أب)|pushup|إيديك أوسع من كتافك والجسم خط مستقيم. انزل لحد ما صدرك يقرب من الأرض وادفع لفوق. لو صعب، اعمله على ركبك.;بلانك|plank|اتسند على كوعك وصوابع رجليك والجسم خط مستقيم. شد بطنك وثبّت من غير ما تحبس نفسك.;بلانك على الحصيرة|plank|اتسند على كوعك وصوابع رجليك والجسم خط مستقيم. شد بطنك وثبّت من غير ما تحبس نفسك.;جسر الحوض|bridge|نام على ضهرك وركبك مثنية. ارفع وسطك لفوق وشد المؤخرة ثانيتين وانزل براحة.;طعن للأمام|lunge|خد خطوة كبيرة لقدّام وانزل لحد ما الركبتين تبقى زاوية قايمة. ارجع واعمل الرجل التانية.;طعن بدمبل|lunge|مسك دمبل في كل إيد، خد خطوة كبيرة لقدّام وانزل بالضهر مفرود، ثم ارجع وبدّل الرجل.;قفز في المكان|jump|اتنطط في مكانك براحة وإيديك مع القفزة. انزل على مشط رجلك بخفة.;تسلق الجبل|climber|وضع الضغط، قرّب ركبة ناحية صدرك وبدّلها بسرعة. خلي الوسط ثابت.;مشي سريع في البيت|walk|امشي بخطوات سريعة ومنتظمة وإيديك بتتحرك مع الخطوة.;مشي سريع|walk|امشي بخطوات سريعة ومنتظمة وإيديك بتتحرك مع الخطوة.;مشي سريع على الجهاز|walk|ابدأ بسرعة منخفضة وزوّدها لحد ما تنهج شوية ولسه تقدر تتكلم. ما تمسكش الجهاز بشدة.;جري خفيف|run|جري بإيقاع هادي تقدر تكلم معاه. انزل على منتصف قدمك وكوعك مثني.;نط حبل|rope|نطات صغيرة على مشط رجلك، والحبل يتلف من معصمك مش من كتفك.;كرانش بطن|crunch|نام وركبك مثنية وإيديك ورا راسك. ارفع كتافك بس من غير ما تشد رقبتك وانزل براحة.;سحب بالحبل المطاطي|pulldown|امسك الحبل من فوق واسحبه لحد صدرك وانت بتضم لوح الكتف، وارجع براحة.;سكوات بدمبل|squat|مسك الدمبل عند صدرك واعمل سكوات: انزل كأنك هتقعد والضهر مفرود، وارجع واقف.;ضغط كتف|press|الدمبل عند كتافك، ادفعه لفوق لحد ما دراعك يتفرد وانزل براحة. ما تقوّسش ضهرك.;تجديف بدمبل|row|انحني بضهر مفرود، واسحب الدمبل ناحية وسطك وضم لوح الكتف، وانزل براحة.;بايسبس|curl|الكوع ثابت جنب جسمك، ارفع الدمبل لكتفك وانزل براحة من غير هز.;ليج بريس|legpress|ضهرك ملزوق في الكرسي، ادفع بالرجلين وما تفردش الركب بالكامل، وارجع براحة.;سحب أمامي|pulldown|اسحب البار لحد صدرك وضم لوح الكتف، وارجع براحة.;ضغط صدر بالجهاز|chestpress|ضهرك ملزوق في الكرسي، ادفع المقبضين لقدّام وارجع براحة.;دراجة ثابتة|bike|اضبط الكرسي، وادوس بإيقاع ثابت وضهرك مفرود.;تمدد وتهدئة|stretch|ارفع إيديك واتمطّى، ومد الرجلين والضهر والكتف 15 ثانية لكل واحد.'.split(';').forEach(function(x){var a=x.split('|');INFO[a[0]]=[a[1],a[2]]});
